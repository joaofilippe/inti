services:
  redis:
    image: redis:7-alpine
    container_name: inti-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: inti-postgres
    environment:
      POSTGRES_USER: inti
      POSTGRES_PASSWORD: inti
      POSTGRES_DB: inti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    container_name: inti-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inti-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inti.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    container_name: inti-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://inti:inti@postgres:5432/inti?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../angular/inti-front
      dockerfile: Dockerfile
      args:
        - GITHUB_TOKEN=${GITHUB_TOKEN}
    container_name: inti-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
